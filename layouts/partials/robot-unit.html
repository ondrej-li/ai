{{- $mode := .mode | default "standby" -}}
{{- $count := .count | default 0 -}}
<figure class="robot-unit" data-state="{{ $mode }}">
  <svg
    class="robot-figure"
    viewBox="0 0 320 320"
    width="320"
    height="320"
    role="img"
    aria-labelledby="robot-unit-title"
  >
    <title id="robot-unit-title">{{ i18n "robot_aria_label" }}</title>
    <defs>
      <linearGradient id="chassis-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1c2432"/>
        <stop offset="100%" stop-color="#0f141d"/>
      </linearGradient>
      <linearGradient id="visor-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#070a0f"/>
        <stop offset="100%" stop-color="#111825"/>
      </linearGradient>
    </defs>

    <!-- Subtle calibration reticle rings -->
    <circle cx="160" cy="166" r="134" fill="none" stroke="currentColor" stroke-opacity="0.09" stroke-dasharray="3 7"/>
    <circle cx="160" cy="166" r="108" fill="none" stroke="currentColor" stroke-opacity="0.06"/>

    <!-- Telemetry antenna mast -->
    <line x1="160" y1="34" x2="160" y2="74" stroke="#64748b" stroke-width="3"/>
    <rect x="151" y="66" width="18" height="10" rx="2" fill="#18202d" stroke="#52627a" stroke-width="1.5"/>
    <circle cx="160" cy="30" r="6" class="robot-beacon"/>
    <circle cx="160" cy="30" r="12" fill="none" class="robot-beacon-ring" stroke-width="1.2"/>

    <!-- Side acoustic / sensor pods -->
    <path d="M58 134h14v56H58l-6-8v-40l6-8Z" fill="#141a24" stroke="#475569" stroke-width="1.6"/>
    <line x1="59" y1="148" x2="67" y2="148" stroke="#64748b" stroke-width="1.5"/>
    <line x1="59" y1="158" x2="67" y2="158" stroke="#64748b" stroke-width="1.5"/>
    <line x1="59" y1="168" x2="67" y2="168" stroke="#64748b" stroke-width="1.5"/>

    <path d="M262 134h-14v56h14l6-8v-40l-6-8Z" fill="#141a24" stroke="#475569" stroke-width="1.6"/>
    <line x1="253" y1="148" x2="261" y2="148" stroke="#64748b" stroke-width="1.5"/>
    <line x1="253" y1="158" x2="261" y2="158" stroke="#64748b" stroke-width="1.5"/>
    <line x1="253" y1="168" x2="261" y2="168" stroke="#64748b" stroke-width="1.5"/>

    <!-- Neck / base mount -->
    <rect x="132" y="242" width="56" height="22" rx="3" fill="#111620" stroke="#475569" stroke-width="1.6"/>
    <line x1="144" y1="242" x2="144" y2="264" stroke="#334155" stroke-width="1.4"/>
    <line x1="160" y1="242" x2="160" y2="264" stroke="#334155" stroke-width="1.4"/>
    <line x1="176" y1="242" x2="176" y2="264" stroke="#334155" stroke-width="1.4"/>
    <path d="M104 264h112l14 22H90l14-22Z" fill="#141a24" stroke="#475569" stroke-width="1.6"/>

    <!-- Main chamfered head chassis -->
    <path
      d="M96 76h128l24 24v118l-24 24H96l-24-24V100l24-24Z"
      fill="url(#chassis-grad)"
      stroke="#52627a"
      stroke-width="2"
    />

    <!-- Inner brow plate & chassis seams -->
    <path d="M98 92h124l12 12v8H86v-8l12-12Z" fill="#121822" stroke="#334155" stroke-width="1.2"/>
    <circle cx="96" cy="100" r="2.2" fill="#64748b"/>
    <circle cx="224" cy="100" r="2.2" fill="#64748b"/>
    <circle cx="96" cy="226" r="2.2" fill="#64748b"/>
    <circle cx="224" cy="226" r="2.2" fill="#64748b"/>

    <!-- Optical visor bay -->
    <rect x="92" y="122" width="136" height="66" rx="10" fill="url(#visor-grad)" stroke="#475569" stroke-width="1.8"/>
    <line x1="96" y1="155" x2="224" y2="155" stroke="#5ce1e6" stroke-opacity="0.12" stroke-width="1"/>

    {{- if eq $mode "offline" }}
    <!-- Offline 404 optics -->
    <path d="M118 143l20 20M138 143l-20 20" stroke="#f2b84b" stroke-width="3.2" stroke-linecap="square"/>
    <path d="M182 143l20 20M202 143l-20 20" stroke="#f2b84b" stroke-width="3.2" stroke-linecap="square"/>
    {{- else }}
    <!-- Dual precision optical sensors -->
    <g class="robot-optics">
      <rect x="112" y="141" width="32" height="24" rx="5" fill="#0d2229" stroke="#5ce1e6" stroke-width="1.6"/>
      <rect x="120" y="148" width="16" height="10" rx="2.5" class="robot-eye"/>
      <rect x="176" y="141" width="32" height="24" rx="5" fill="#0d2229" stroke="#5ce1e6" stroke-width="1.6"/>
      <rect x="184" y="148" width="16" height="10" rx="2.5" class="robot-eye"/>
    </g>
    {{- end }}

    <!-- Lower voice / telemetry grille -->
    <rect x="116" y="204" width="88" height="16" rx="3" fill="#0b0f16" stroke="#334155" stroke-width="1.2"/>
    <rect x="124" y="209" width="14" height="6" rx="1" class="robot-led"/>
    <rect x="144" y="209" width="14" height="6" rx="1" fill="#273447"/>
    <rect x="164" y="209" width="14" height="6" rx="1" fill="#273447"/>
    <rect x="184" y="209" width="12" height="6" rx="1" fill="#273447"/>
  </svg>

  <figcaption class="robot-telemetry mono">
    <dl class="telemetry-list">
      <div>
        <dt>{{ i18n "robot_status_label" }}</dt>
        <dd>
          <span class="status-badge" data-state="{{ $mode }}">
            {{- if eq $mode "offline" -}}
              {{ i18n "not_found_code" }}
            {{- else if gt $count 0 -}}
              {{ i18n "robot_status_online" }}
            {{- else -}}
              {{ i18n "robot_status_standby" }}
            {{- end -}}
          </span>
        </dd>
      </div>
      {{- if ne $mode "offline" }}
      <div>
        <dt>{{ i18n "robot_corpus_label" }}</dt>
        <dd>{{ printf "%02d" $count }}</dd>
      </div>
      <div>
        <dt>{{ i18n "robot_lang_label" }}</dt>
        <dd>{{ i18n "robot_lang_value" }}</dd>
      </div>
      {{- end }}
    </dl>
  </figcaption>
</figure>

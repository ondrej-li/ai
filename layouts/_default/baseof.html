<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link visually-hidden" href="#main-content">{{ i18n "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main-content" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | minify | fingerprint "sha256" }}
  <script type="module" src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
</body>
</html>

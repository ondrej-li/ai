# ai.ondralinek.cz — HTTP-only bootstrap vhost used until TLS certificate exists.
# Source of truth: https://github.com/ondrej-li/ai/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name ai.ondralinek.cz;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    root /var/www/ai;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/ai.access.log;
    error_log  /var/log/nginx/ai.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.html$ {
        expires -1;
    }

    location ~* \.(css|js|png|svg|webp|avif|ico)$ {
        expires 30d;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}

# ai.ondralinek.cz — bilingual (EN/CS) static Hugo site on AI.
# Source of truth: https://github.com/ondrej-li/ai/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name ai.ondralinek.cz;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.ondralinek.cz;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    root /var/www/ai;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ai.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ai.access.log;
    error_log  /var/log/nginx/ai.error.log;

    include /etc/nginx/snippets/ai-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/ai-headers.conf;
    }

    # Pages are revalidated so deploys appear immediately while preserving bfcache.
    location ~* \.html$ {
        expires -1;
        include /etc/nginx/snippets/ai-headers.conf;
    }

    # Fingerprinted CSS and JS assets can be cached aggressively.
    location ~* \.(css|js)$ {
        expires 1y;
        include /etc/nginx/snippets/ai-headers.conf;
    }

    location ~* \.(png|svg|webp|avif|jpg|jpeg|ico)$ {
        expires 30d;
        include /etc/nginx/snippets/ai-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        include /etc/nginx/snippets/ai-headers.conf;
    }
}
